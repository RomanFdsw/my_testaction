name: Deploy project
on: push 
jobs: 
    test: 
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./second-action
        steps:
            - name: Get code
              uses: actions/checkout@v3
            - name: Install NodeJs
              uses: actions/setup-node@v3
              with: 
                node-version: 18
            - name: Install dependencies 
              run: npm ci
            - name: Run tests
              run: npm test
    deploy:
      needs: test
      defaults:
        run:
          working-directory: ./second-action      
      runs-on: ubuntu-latest
      steps:
         - name: Get code
           uses: actions/checkout@v3
         - name: Install new NodeJs
           uses: actions/setup-node@v3
           with:
             node-version: 18
         - name: Install dependencies
           run: npm ci 
         - name: Run tests 
           run: npm test
         - name: Build the project 
           run: npm run build
         - name: Deploy
           run: echo "Deploying...."
       